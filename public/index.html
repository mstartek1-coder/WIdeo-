<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WIdeo Studio</title>
  <meta name="description" content="Studio do hiperrealistycznego tworzenia wideo z dźwiękiem i animacją.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/studio.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%23f5b041'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">▶</span> WIdeo<b>Studio</b></div>
    <input id="project-name" class="project-name" aria-label="Nazwa projektu" spellcheck="false">
    <nav class="actions">
      <button data-action="undo" title="Cofnij (Ctrl+Z)">↶</button>
      <button data-action="redo" title="Ponów (Ctrl+Shift+Z)">↷</button>
      <span class="sep"></span>
      <button data-action="new">Nowy</button>
      <button data-action="demo">Demo</button>
      <label class="btn" title="Otwórz projekt JSON">Otwórz<input type="file" id="open-file" accept=".json,application/json" hidden></label>
      <button data-action="save">Zapisz</button>
      <span class="sep"></span>
      <button data-action="snapshot" title="Zapisz bieżącą klatkę jako PNG">Klatka</button>
      <button data-action="export-wav" title="Miks dźwięku całego filmu">Audio WAV</button>
      <button class="primary" data-action="export-video">Eksportuj film</button>
    </nav>
  </header>

  <main class="layout">
    <aside class="left">
      <section class="panel" id="director"></section>
      <section class="panel grow" id="scenes"></section>
      <section class="panel" id="jobs"></section>
    </aside>

    <section class="center">
      <div class="viewer" id="viewer">
        <canvas id="view"></canvas>
        <div class="hud" id="hud"></div>
        <div class="busy" id="busy" hidden></div>
      </div>
      <div class="transport">
        <button id="btn-start" title="Na początek (Home)">⏮</button>
        <button id="btn-play" class="play" title="Odtwórz / pauza (Spacja)">▶</button>
        <span class="timecode"><span id="tc-now">00:00:00</span> / <span id="tc-total">00:00:00</span></span>
        <label class="toggle"><input type="checkbox" id="chk-loop"> Pętla</label>
        <span class="spacer"></span>
        <label class="inline">Podgląd
          <select id="sel-quality">
            <option value="0.25">25%</option>
            <option value="0.5" selected>50%</option>
            <option value="0.75">75%</option>
            <option value="1">100%</option>
          </select>
        </label>
      </div>
      <div class="timeline" id="timeline"></div>
    </section>

    <aside class="right">
      <div class="tabs" id="inspector-tabs" role="tablist"></div>
      <div class="inspector" id="inspector"></div>
    </aside>
  </main>

  <dialog id="export-dialog">
    <h3 id="export-title">Eksport</h3>
    <p id="export-status" class="muted"></p>
    <div class="progress"><div id="export-bar"></div></div>
    <p class="hint">Film jest nagrywany w czasie rzeczywistym – nie zamykaj i nie przełączaj tej karty.</p>
    <div class="row end"><button id="export-cancel">Anuluj</button></div>
  </dialog>

  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
